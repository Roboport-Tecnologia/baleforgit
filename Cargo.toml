[workspace]
resolver = "2"
exclude = [
    "xet-core",
    "git-lfs",
    "lfs-adapter",
]
members = [
    "crates/xet-server-core",
    "crates/xet-server-wire",
    "crates/xet-server-shard",
    "crates/xet-server-storage-fs",
    "crates/xet-server-storage-mem",
    "crates/xet-server-meta-sqlite",
    "crates/xet-server-authz-mem",
    "crates/xet-server-authz-http",
    "crates/xet-server-tokens",
    "crates/xet-server-http",
    "crates/xet-server-bin",
    "crates/xet-server-tests",
    "crates/git-dfs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "=1.0.102"
async-trait = "=0.1.89"
axum = { version = "=0.8.9", features = ["macros"] }
blake3 = "=1.8.5"
bytes = "=1.11.1"
hex = "=0.4.3"
hmac = "=0.13.0"
http-body-util = "=0.1.3"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["use_pem", "rust_crypto"] }
rand = "=0.10.1"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["full"] }
tower = "=0.5.3"
tower-http = { version = "=0.6.11", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.23.1", features = ["v4"] }

xet-server-core = { path = "crates/xet-server-core" }
xet-server-wire = { path = "crates/xet-server-wire" }
xet-server-shard = { path = "crates/xet-server-shard" }
xet-server-storage-fs = { path = "crates/xet-server-storage-fs" }
xet-server-storage-mem = { path = "crates/xet-server-storage-mem" }
xet-server-meta-sqlite = { path = "crates/xet-server-meta-sqlite" }
xet-server-authz-mem = { path = "crates/xet-server-authz-mem" }
xet-server-authz-http = { path = "crates/xet-server-authz-http" }
xet-server-tokens = { path = "crates/xet-server-tokens" }
xet-server-http = { path = "crates/xet-server-http" }
