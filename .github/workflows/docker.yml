name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag to push for this manual run (e.g. test, my-feature). The sha-<short> tag is always pushed too.'
        required: false
        default: 'test'

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & push to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by actions/attest-build-provenance to mint a Sigstore-backed
      # SLSA Build Provenance attestation referencing the pushed image digest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ${{ github.repository }} → e.g. davidrios/git-xet-server.
          # Lowercased automatically by the action.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        # `push-to-registry: true` writes a Sigstore-backed attestation as an
        # OCI referrer alongside the image, so `gh attestation verify
        # oci://…@<digest>` and `cosign verify-attestation` both work.
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
