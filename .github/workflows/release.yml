name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        # One cargo invocation so xet-server and git-dfs share the dep build.
        run: cargo build --release -p xet-server-bin -p git-dfs --target ${{ matrix.target }}
      - name: Package
        # One tarball per binary, each paired with its own .sha256. Keeps
        # downloads small for users who only want one of the two.
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in xet-server git-dfs; do
            tarball="${bin}-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
            tar -C "target/${{ matrix.target }}/release" -czf "dist/${tarball}" "$bin"
            (cd dist && shasum -a 256 -- "$tarball" > "${tarball}.sha256")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
