name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the test release (e.g. v0.0.0-test). Will be published as a draft prerelease — the git tag is NOT created until you publish the draft.'
        required: true
        default: 'v0.0.0-test'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Tag-push event: github.ref_name is the pushed tag.
  # workflow_dispatch event: take it from the form input instead.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Required by actions/attest-build-provenance to mint a Sigstore-backed
      # SLSA Build Provenance attestation for each tarball.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        # One cargo invocation so xet-server and git-dfs share the dep build.
        run: cargo build --release -p xet-server-bin -p git-dfs --target ${{ matrix.target }}
      - name: Package
        # One tarball per binary, each paired with its own .sha256. Keeps
        # downloads small for users who only want one of the two.
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in xet-server git-dfs; do
            tarball="${bin}-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
            tar -C "target/${{ matrix.target }}/release" -czf "dist/${tarball}" "$bin"
            (cd dist && shasum -a 256 -- "$tarball" > "${tarball}.sha256")
          done
      - name: Attest build provenance
        # One attestation per matrix entry, covering both tarballs for this
        # target. The .sigstore.json bundles end up referenced from GitHub's
        # attestations API and verifiable with `gh attestation verify`.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/xet-server-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            dist/git-dfs-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            dist/*

      - name: Create draft prerelease (manual dispatch)
        # --draft means the git tag is NOT created in the repo until the
        # release is published. Delete-then-create lets a re-dispatch on the
        # same tag name overwrite a stale draft from a prior test run.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes 2>/dev/null || true
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG} (manual test build)" \
            --draft --prerelease \
            --generate-notes \
            dist/*

  docker:
    name: build & push docker image to ghcr.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by actions/attest-build-provenance to mint a Sigstore-backed
      # SLSA Build Provenance attestation referencing the pushed image digest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ${{ github.repository }} → e.g. davidrios/git-xet-server.
          # Lowercased automatically by the action.
          images: ghcr.io/${{ github.repository }}
          # value=${{ env.RELEASE_TAG }} lets semver tags work for both real
          # tag pushes and manual_dispatch (where github.ref is a branch).
          # `latest` is auto-managed by the action (set on non-prerelease
          # semver), so manual test dispatches don't clobber it.
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        # push-to-registry: true writes a Sigstore-backed attestation as an
        # OCI referrer alongside the image, so `gh attestation verify
        # oci://…@<digest>` and `cosign verify-attestation` both work.
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
